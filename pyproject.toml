[project]
name = "palkova"
version = "0.1.0"
description = "Voice ordering line for Indian restaurants, paid through PayPal"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "twilio==9.12.0",
    "tzdata==2026.6",
    "itsdangerous",
    "jsonschema==4.26.0",
    "openai==3.42.0",
    "mcp==2.3.0",
    "paypal-server-sdk==2.4.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
